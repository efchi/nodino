<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nodino v2 Demo</title>
    <!-- Nodino's own menu/chrome styles (debug panel, view mode toggle, detail
         panel, progress bar) — required by nodino.js, hand-editable separately
         from this demo's own toolbar styling below. -->
    <link rel="stylesheet" href="nodino.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: sans-serif;
            font-size: 9pt;
            color: #000;
        }

        #graph {
            position: fixed;
            inset: 0;
        }

        #toolbar {
            position: absolute;
            /* Top-left: Nodino's own chrome has moved to the right-hand side
               (simulation controls + ⚙ toggle on the top row, debug panel
               below them), leaving this corner to the host. */
            top: 6px;
            left: 6px;
            z-index: 30;
            background: rgb(215 215 230 / 80%);
            color: rgb(25 25 57);
            border-radius: 6px;
            padding: 6px;
            width: 220px;
            box-sizing: border-box;
            /* Bounded and scrollable rather than left to grow past the
               window: harmless at any desktop size this panel's content has
               ever reached, but a phone in landscape is short enough that
               three open groups would otherwise run under the fold. */
            max-height: calc(100vh - 12px);
            overflow-y: auto;
        }

        /* Shown only under the responsive query below; collapses/expands the
           panel body without touching anything else about it. Absent here
           (display: none) so desktop keeps exactly its current behavior —
           the panel always open, nothing to click to hide it. */
        #toolbar-toggle {
            display: none;
            margin-left: auto;
            flex: none;
            width: 20px;
            height: 20px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: rgb(25 25 57);
            font: 12px sans-serif;
            cursor: pointer;
        }

        /* Below 1200px: the panel takes over a good chunk of an already-
           narrow window, and it starts in the user's way of the graph it
           sits on top of. Capped narrower, and collapsible to just its title
           bar — collapsed by default on load (see the script below), so the
           graph is what greets a narrow-window visitor, with the panel one
           tap away. */
        @media (max-width: 1200px) {
            #toolbar {
                width: min(220px, 72vw);
                /* Moved off the top edge, which the top-centre row (search +
                   geometry + view toggle) now has to itself instead of
                   sharing with this panel diagonally across from Nodino's own
                   chrome — two unrelated panels anchored to the two top
                   corners of an already-narrow screen was the actual
                   crowding. Bottom instead of top, same corner (left) — 30px
                   rather than 6px so the panel clears .nodino-time, which
                   still sits at its usual bottom: 8px here. max-height's
                   budget shrinks by the 24px this offset gained over the old
                   6px (12 -> 42), so an expanded panel still fits above
                   whatever is below it rather than the two ever overlapping. */
                top: auto;
                bottom: 30px;
                max-height: calc(100vh - 42px);
            }

            #toolbar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #toolbar.collapsed {
                width: auto;
                max-height: none;
                overflow: visible;
            }

            #toolbar.collapsed > details {
                display: none;
            }

            /* h1's own margin-bottom (8px, set below) is larger than its
               margin-top (3px) on purpose — it separates the title from the
               groups under it. Collapsed, there are no groups left to
               separate from, so it fell back to the summary bars' own
               symmetric 3px, matching the top and making the collapsed bar's
               padding read as even top-to-bottom instead of bottom-heavy. */
            #toolbar.collapsed h1 {
                margin-bottom: 3px;
            }
        }

            /* Heading and group headers share one look — the heading is just
               the first, non-collapsible one — so the panel reads as a single
               stack of bars rather than a title plus some widgets. Only the
               font-size sets it apart. Mirrors the debug panel's own summary
               styling on the other side of the screen. */
            
            #toolbar summary {
                background: hsl(0deg 0% 100% / 95%);
                color: rgb(25 25 57);
                border-radius: 5px;
                padding: 5px 6px;
                margin: 3px 0;
                font-weight: bold;
            }

            /* The heading is the one bar that is not a <summary>, so it takes
               the summary's own background and radius explicitly — without
               them it was the single transparent row in a stack of white
               ones, which read as a caption floating above the panel rather
               than as its first bar. Only the font-size and the mark to its
               left set it apart now.

               Larger bottom margin than a summary's 3px: it separates the
               title from the groups, which are a set among themselves. */
            #toolbar h1 {
                font-size: 11pt;
                padding: 5px 6px;
                margin: 3px 0 8px 0;
                font-weight: bold;
                background: hsl(0deg 0% 100% / 60%);
                border-radius: 5px;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            /* flex: none because a flex item holding the mark will otherwise
               be squashed by a long title. logo.svg carries its own colours
               (it has to — it's shared with README.md, outside this page's
               palette), so there is no currentColor rule to set here
               any more. */
            #toolbar h1 img {
                flex: none;
                display: block;
            }

            #toolbar summary {
                font-size: 9pt;
                cursor: pointer;
                user-select: none;
            }

            /* Padding-top separates a group's contents from its own header,
               padding-bottom from the next group's header below. */
            #toolbar .group-body {
                padding: 3px 2px;
            }

            #toolbar .row {
                margin: 2px 0;
                display: flex;
                gap: 4px;
                align-items: center;
            }

            #toolbar input[type=number],
            #toolbar select,
            #toolbar textarea {
                background: rgba(255, 255, 255, 0.6);
                border: 1px solid rgb(75 75 139 / 35%);
                border-radius: 4px;
                color: rgb(25 25 57);
            }

            #toolbar input[type=number] {
                width: 60px;
                padding: 2px 3px;
            }

            #toolbar select {
                flex: 1;
                padding: 2px 3px;
                font-size: 9pt;
            }

            /* Buttons sharing a row split it evenly, so the row keeps a
               straight right edge whatever the labels say. */
            #toolbar .row button {
                flex: 1;
            }

            #toolbar button {
                cursor: pointer;
                padding: 2px 4px;
                background: rgba(255, 255, 255, 0.6);
                border: 1px solid rgb(75 75 139 / 35%);
                border-radius: 4px;
                color: rgb(25 25 57);
            }

            #toolbar textarea {
                width: 100%;
                height: 60px;
                box-sizing: border-box;
                font-family: monospace;
                font-size: 8pt;
                margin-top: 4px;
                padding: 2px 3px;
            }

        /* Spinner shown in either detail card while this page's (simulated)
           fetch is in flight. It lives here, not in nodino.css, because Nodino
           has no loading state of its own: the handler is handed the card's
           body element and whatever it puts there stays until the promise
           resolves, so the placeholder is entirely the host's to design. */
        .demo-spinner {
            display: inline-block;
            width: 11px;
            height: 11px;
            box-sizing: border-box;
            border: 2px solid rgb(75 75 139 / 20%);
            /* One coloured arc against a faint ring, so the rotation reads at
               this size — a uniform ring would look static while spinning. */
            border-top-color: rgb(75 75 139 / 70%);
            border-radius: 50%;
            animation: demo-spin .6s linear infinite;
        }

        @keyframes demo-spin {
            to { transform: rotate(360deg); }
        }

        /* The action this page puts in the *pinned* card only — the hovering
           one cannot be clicked, so a button in it would be a promise the card
           can't keep. Same pill shape as the toolbar's buttons, smaller: it
           sits inside an 11px card, not a control bar. */
        .demo-action {
            cursor: pointer;
            margin-top: 4px;
            padding: 1px 5px;
            font: inherit;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgb(75 75 139 / 35%);
            border-radius: 4px;
            color: rgb(25 25 57);
        }
    </style>
</head>
<body>
    <div id="graph"></div>

    <!-- Reset/Run/Pause/Force live inside the widget itself (Nodino's own
         simulation-controls bar, top-right) — driving the lifecycle is the
         widget's business, not the host's. This panel keeps only what is
         genuinely the host's: where the data comes from. Its three groups are
         therefore the three data sources, one collapsible each. -->
    <div id="toolbar">
        <!-- The project's own mark (logo.svg, also at the top of README.md)
             rather than a bespoke currentColor icon: one drawing of "the
             boundary disk with a small graph inside it" instead of two to
             keep in sync. -->
        <h1>
            <img src="logo.svg" width="18" height="18" alt="" aria-hidden="true" />
            Nodino Demo
            <!-- Mobile-only (see #toolbar-toggle in the style block above) —
                 collapses/expands the panel body below. Invisible and inert
                 on desktop, so nothing here changes desktop behavior. -->
            <button id="toolbar-toggle" type="button" title="Collapse panel">▾</button>
        </h1>

        <details>
            <summary>Presets</summary>
            <div class="group-body">
                <div class="row">
                    <!-- Deliberately empty for now — the preset datasets
                         themselves are still to come. -->
                    <select id="preset-select">
                        <option value="">No presets yet</option>
                    </select>
                </div>
            </div>
        </details>

        <details>
            <summary>Load from JSON</summary>
            <div class="group-body">
                <!-- Both buttons on this row only *fill* the box below; Load
                     is the single thing that ingests it. So whatever arrives —
                     from a file or from the graph's own current state — can be
                     read and edited before it replaces what is on screen. -->
                <div class="row">
                    <button id="btn-export-current" title="Fill the box below with the graph as it stands now, positions included — load it back to exercise the restore path">Export Current</button>
                    <button id="btn-import-file" title="Fill the box below with the contents of a JSON file">Import from File</button>
                    <input type="file" id="file-input" accept="application/json" hidden />
                </div>
                <textarea id="paste-input" placeholder='{"edges":[["a","b",0.5]],"nodes":{"a":{"m":{}}}}'></textarea>
                <div class="row">
                    <button id="btn-import-paste">Load</button>
                </div>
            </div>
        </details>

        <!-- Open by default: it is the demo's primary path, and the page
             generates a random graph on load anyway. The other two start
             collapsed. -->
        <details open>
            <summary>Random Generation</summary>
            <div class="group-body">
                <div class="row">
                    <input type="number" id="node-count" min="0" max="5000" step="50" value="400" title="Number of nodes to generate" />
                    <button id="btn-generate">Generate Nodes</button>
                </div>
            </div>
        </details>
    </div>

    <script src="nodino.js"></script>
    <script>
        function generateRandomGraph(nodeCount) {
            var nodes = {};
            for (var i = 0; i < nodeCount; i++) {
                nodes['n' + i] = { m: { title: 'Random generated node #' + i } };
            }

            var edges = [];
            var unrelatedFactor = 0.9; // mirrors the PoC's random generator
            for (var i = 0; i < nodeCount - 1; i++) {
                for (var j = i + 1; j < nodeCount; j++) {
                    if (Math.random() < unrelatedFactor) continue;
                    var weight = (Math.random() * 2) - 1;
                    edges.push(['n' + i, 'n' + j, weight]);
                }
            }

            return { nodes: nodes, edges: edges };
        }

        // The two card handlers. They share everything except the last line,
        // which is the point: the hovering card is read at a glance and cannot
        // be clicked, the pinned one can, so only the pinned one is given an
        // action. Written as two thin functions over one body rather than as
        // one function with a flag, because that is the shape a host with
        // genuinely different cards would end up with anyway.
        function onNodeHover(node, body) {
            return fillCard(node, body, false);
        }

        function onNodePin(node, body) {
            return fillCard(node, body, true);
        }

        function fillCard(node, body, withActions) {
            // The panel already shows the uid as its title, so a handler only
            // has to supply what Nodino cannot know. `body` is the empty slot
            // under that title, and both routes into it are used here: DOM
            // written straight into `body` (the spinner), then an HTML string
            // returned asynchronously, which replaces it on arrival.
            //
            // The loading state is this page's, not Nodino's — the library
            // renders no placeholder of its own, it just leaves the slot
            // alone until the promise settles.
            var spinner = document.createElement('span');
            spinner.className = 'demo-spinner';
            body.appendChild(spinner);

            // The listener goes on the slot rather than on the button: the
            // string returned below replaces the slot's *children*, so
            // anything bound to a button that does not exist yet would be
            // thrown away by its own arrival. Assigned, not added, so a
            // hundred pins leave one listener behind, not a hundred.
            if (withActions) {
                body.onclick = function (e) {
                    if (e.target.getAttribute('data-action') !== 'copy') return;
                    copyText(node.uid, e.target);
                };
            }

            // Simulated async fetch, so the spinner is actually visible.
            return new Promise(function (resolve) {
                setTimeout(function () {
                    var title = node.m && node.m.title;
                    // Empty string, not null: null means "leave the slot as
                    // it is", which here would leave the spinner turning.
                    resolve(
                        (title ? '<i>' + title + '</i>' : '') +
                        (withActions
                            ? (title ? '<br>' : '') +
                              '<button class="demo-action" data-action="copy">Copy uid</button>'
                            : '')
                    );
                }, 150);
            });
        }

        // Copies text and says so on the button that asked. The fallback is
        // there because navigator.clipboard needs a secure context and this
        // page is usually opened straight off the filesystem, where there
        // isn't one.
        function copyText(text, button) {
            // Remembered on the element, so a second click while the
            // confirmation is still up restores 'Copy uid' and not 'Copied'.
            var label = button.getAttribute('data-label') || button.textContent;
            button.setAttribute('data-label', label);

            function done() {
                button.textContent = 'Copied';
                setTimeout(function () { button.textContent = label; }, 900);
            }

            function legacy() {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); done(); } catch (err) { /* nothing to say */ }
                document.body.removeChild(ta);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, legacy);
            } else {
                legacy();
            }
        }

        var inputNodeCount = document.getElementById('node-count');
        var btnGenerate = document.getElementById('btn-generate');
        var btnImportFile = document.getElementById('btn-import-file');
        var fileInput = document.getElementById('file-input');
        var pasteInput = document.getElementById('paste-input');
        var btnImportPaste = document.getElementById('btn-import-paste');
        var btnExportCurrent = document.getElementById('btn-export-current');
        var toolbarEl = document.getElementById('toolbar');
        var toolbarToggle = document.getElementById('toolbar-toggle');

        // The one threshold both the CSS above and the two defaults below
        // agree on — 1200px, same number the @media queries in this file and
        // in nodino.css use, kept here as a single value so the three never
        // drift apart from each other.
        var RESPONSIVE_QUERY = window.matchMedia('(max-width: 1200px)');

        // Collapse state is a class, not a style, so the responsive query
        // above owns what "collapsed" looks like and this only ever flips the
        // one class. The button is display: none on desktop (see
        // #toolbar-toggle in <style>), so this handler is unreachable there
        // regardless.
        function setToolbarCollapsed(collapsed) {
            toolbarEl.classList.toggle('collapsed', collapsed);
            toolbarToggle.textContent = collapsed ? '▸' : '▾';
            toolbarToggle.title = collapsed ? 'Expand panel' : 'Collapse panel';
        }

        toolbarToggle.onclick = function () {
            setToolbarCollapsed(!toolbarEl.classList.contains('collapsed'));
        };

        // Starts collapsed on a narrow-window load, so the graph is what's on
        // screen first rather than a panel covering most of it — one tap on
        // the toggle brings it back. Checked once at load, not tracked live:
        // a mid-session resize (rotating a phone, resizing a window past the
        // threshold) is rare enough here not to warrant a matchMedia
        // listener, and either way the toggle still works by hand.
        if (RESPONSIVE_QUERY.matches) setToolbarCollapsed(true);

        // The data last handed to load(). Nodino gives the positions back
        // (getPositions()) but not the nodes and edges — those never stopped
        // being this page's, so this page is what remembers them.
        var currentData = null;

        // No onStateChange listener and nothing polling getStats(): both the
        // lifecycle controls and the node/edge counts are the widget's own
        // chrome now, kept in sync inside it. What is left here is only data
        // ingestion — which is the point of the demo.
        var instance = Nodino.create(document.getElementById('graph'), {
            // maxConvergenceFrames: 500 is a demo-only override (library
            // default 7200) — low enough that the step budget actually
            // competes with the 5-second one instead of sitting behind it as
            // a backstop, so which of the two ends a run depends on the
            // machine and both endings are visible here. The crossover is
            // 100 steps/s. Not something a real embedding host should copy.
            //
            // logEvents traces controls, API calls, transitions and callbacks
            // to the console (library default false). On here because this is
            // the page for watching the state machine work.
            //
            // debug starts closed under the same responsive threshold the
            // toolbar collapses under — same reasoning as that panel, mirrored
            // to the other bottom corner: on a narrow window this is the
            // graph's own config/tweak panel, not something a first-time
            // visitor needs open immediately, and the ⚙ toggle (which stays
            // visible either way) is one tap from reopening it.
            config: {
                debug: !RESPONSIVE_QUERY.matches,
                logEvents: true,
                physics: { maxConvergenceFrames: 500 }
            }
        });

        // load() only builds and draws the initial layout — it never starts the
        // simulation on its own, here or in the library. Run (in the widget's
        // own control bar) is a separate, explicit step.
        function loadGraph(data) {
            if (!data || !Array.isArray(data.edges)) {
                alert('Invalid graph JSON: expected { "edges": [["uid1","uid2",weight], ...], "nodes"?: {...}, "positions"?: {...} }');
                return;
            }
            currentData = data;
            // The card handlers are bound per dataset, not per instance: every
            // one of this demo's sources happens to want the same pair, but
            // they each have to say so.
            instance.load(data, {
                onNodeHover: onNodeHover,
                onNodePin: onNodePin,
                onSettle: onSettle,
                onPause: onSettle
            });
        }

        // Fires on every convergence, forced ones included — and, bound to
        // onPause as well, on every pause, whose payload has the same shape
        // with `reason: 'paused'`. One handler covers both deliberately: to a
        // host caching layouts the two are the same offer, a layout plus the
        // step count that produced it, and only `reason` says whether the run
        // that produced it is over. A real host would store the positions
        // here and hand them back as `data.maxFrames` on the next load, so a
        // run that cannot improve on the cached one need not happen at all.
        // This page only reports the numbers; the caching is the
        // application's.
        function onSettle(result) {
            // `frames` is what this layout cost — including the steps it was
            // restored with, so forcing a cached layout further always beats
            // the record it started from ([D API.7]); `reason` says whether it
            // arrived. A real host would always keep a 'converged' layout and
            // compare step counts only among 'capped' ones, which are
            // unfinished by definition.
            console.log(
                '[nodino] ' + result.state + ' (' + result.reason + ')' +
                ' after ' + result.frames + ' frames' +
                ' (best before this run: ' + result.maxFrames + ')' +
                (result.frames > result.maxFrames ? ' — new best' : '') +
                ' [hash ' + result.hash + ']'
            );
        }

        btnGenerate.onclick = function () {
            var count = parseInt(inputNodeCount.value, 10) || 0;
            loadGraph(generateRandomGraph(count));
        };

        btnImportFile.onclick = function () { fileInput.click(); };

        // Fills the box, like Export Current beside it, and stops there: both
        // top-row buttons are ways of *getting JSON into* the textarea, and
        // Load below is the single thing that ingests it. So a file can be
        // looked at, and edited, before it replaces the graph on screen —
        // trimming `positions` down to a partial set, say. Nothing is parsed
        // here either: the file lands verbatim, and Load is where malformed
        // JSON is reported, one click later and with the text in front of you.
        fileInput.onchange = function () {
            var file = fileInput.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function () { pasteInput.value = reader.result; };
            reader.readAsText(file);
            fileInput.value = '';
        };

        btnImportPaste.onclick = function () {
            try {
                loadGraph(JSON.parse(pasteInput.value));
            } catch (err) {
                alert('Could not parse pasted JSON: ' + err.message);
            }
        };

        // Writes into the box below exactly what a caching host would store:
        // the graph this page owns, plus the layout Nodino computed for it and
        // the step count that got there. Loading it straight back is the whole
        // point — positions covering every node are a result rather than a
        // seed, so the graph reopens settled without running ([D Data.3]).
        // Available at any time, not only once converged: exporting mid-run is
        // a legitimate snapshot, and `maxFrames` says how far it got.
        //
        // `frames`, deliberately, and not the higher of the two counts: the
        // field describes the positions travelling with it ([D API.7]), and
        // `maxFrames` may be the record of a *better* run whose layout this
        // export does not contain — Reset back to a cached layout after
        // forcing past it, and the record is ahead of what is on screen.
        // Exporting the record there would reopen this layout claiming steps
        // that produced a different one.
        // Both layouts go into the export, not just the one currently on
        // screen. They are two embeddings of the same graph, produced by the
        // same run and settled together, so a snapshot that carried only the
        // visible one would reopen with the other back at its starting
        // distribution — which is exactly the out-of-step restore the library
        // documents as the thing a caching host should avoid.
        btnExportCurrent.onclick = function () {
            if (!currentData) return;
            pasteInput.value = JSON.stringify({
                nodes: currentData.nodes,
                edges: currentData.edges,
                positions: instance.getPositions(),
                globePositions: instance.getGlobePositions(),
                maxFrames: instance.getStats().frames
            });
        };

        window.addEventListener('load', function () {
            btnGenerate.click();
        });
    </script>
</body>
</html>
